# ============================================================================
# pxe-web 装机源 HTTP 服务（nginx）
#
# 用法：
#   1) 先禁用 Ubuntu 自带的默认站点（它也占了 80 的 default_server，会冲突）
#        sudo rm -f /etc/nginx/sites-enabled/default
#   2) 拷过去
#        sudo cp deploy/nginx/pxe-web.conf /etc/nginx/conf.d/
#   3) 检查并生效
#        sudo nginx -t && sudo systemctl reload nginx
#
# 场景：几十台裸机同时 HTTP 拉 GB 级 ISO + 内核，重点是零拷贝和大带宽 TCP。
#
# ⚠ 为什么性能参数都写在 server{} 里而不是文件顶层：
#    Ubuntu/Debian 自带的 /etc/nginx/nginx.conf 在 http{} 里已经写了
#    sendfile / tcp_nopush / keepalive_timeout / gzip，而 conf.d 是在 http{}
#    内 include 的 —— 同层再写一次会报 "directive is duplicate"。
#    放进 server{} 就变成了"覆盖继承值"，合法且只对本站生效。
#    只有 limit_conn_zone 和 log_format 必须在 http 层（nginx 限制），
#    这两个名字不和系统默认撞，所以留在顶层没问题。
# ============================================================================

# ---------------------------------------------------------------- http 层（只能写这儿的两条）
# 单 IP 并发连接数统计区。一台机器装机通常同时拉 3~5 个文件，10 足够，
# 主要是防止异常客户端把连接槽占满。
limit_conn_zone $binary_remote_addr zone=pxe_perip:10m;

# 装机日志格式（名字叫 pxe_main，避免和系统自带的 main 重名）
log_format pxe_main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent $request_time '
                    '"$http_user_agent"';

# ============================================================================
# 装机源站点
# ============================================================================
server {
    listen 80 default_server;
    # 没有 IPv6 的环境（或者 nginx 报 Address family not supported）就把下面这行注释掉
    # listen [::]:80 default_server;
    server_name _;

    # ★ HTTP 安装源根目录 —— 与平台 PXE_WWW_ROOT / PXE_IMAGES_DIR 默认值一致
    root /opt/pxe-web/var/www/html;

    # 平台使用的路径形如：
    #   /x86/<镜像名>/<ISO>          → /opt/pxe-web/var/www/html/x86/<镜像名>/<ISO>
    #   /UKI/x86/<系统类型>/vmlinuz  → /opt/pxe-web/var/www/html/UKI/x86/<系统类型>/vmlinuz
    # 与 images._url_path() 的输出一一对应，不要在这里加 alias 改动层级。

    # ------------------------------------------------------------ 传输（大文件核心）
    # 零拷贝：内核直接把页缓存里的文件数据送进 socket，不经过用户空间。
    # 最关键的一条，没有它 10G 网卡根本跑不满。
    sendfile on;

    # 单次 sendfile 最多传这么多就让出 worker，避免一个超大连接饿死其它客户端。
    # 2m 是吞吐和公平性的折中：单机追求极致速度可调 8m，客户端很多时调 512k~1m。
    sendfile_max_chunk 2m;

    # 把「读文件」这个可能阻塞的动作丢进线程池，worker 不再卡在磁盘 I/O 上。
    # 慢磁盘 / 机械盘 / 高并发时必须开。需要 nginx 编译带 --with-threads：
    #   nginx -V 2>&1 | grep -o with-threads
    aio threads;
    # 想用独立线程池（更可控）就把 thread_pool 写进 nginx.conf 的 main 层，再改这里：
    #   aio threads=pxe_disk;

    # 攒满一个 MSS 再发，减少小包，提高有效载荷占比
    tcp_nopush on;
    # keepalive 连接上的小响应立即发出（与 tcp_nopush 不冲突）
    tcp_nodelay on;

    # ------------------------------------------------------------ 文件缓存
    # 缓存已打开文件的描述符和 stat 结果，省掉每次请求的 open/stat。
    # valid 别设太长：平台刚写完 ISO 时，缓存的旧大小信息可能导致传输异常。
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    # 不缓存"文件不存在"：平台上传完 ISO 后客户端可能马上来拉，
    # 缓存了 404 会让刚传好的文件短暂取不到
    open_file_cache_errors off;

    # ------------------------------------------------------------ 其它
    server_tokens off;
    # 客户端超时后直接发 RST 回收 socket，不进 FIN_WAIT 慢慢耗
    reset_timedout_connection on;

    # ISO / 内核都是已压缩或二进制内容，gzip 纯浪费 CPU 还可能拖慢首字节。
    # （Ubuntu 默认 nginx.conf 里是 gzip on，这里显式关掉覆盖它）
    gzip off;

    # ------------------------------------------------------------ 日志
    # 几十台同时拉，access_log 直写磁盘会有明显 I/O 抖动，用 buffer 攒着批量刷
    access_log /var/log/nginx/pxe-access.log pxe_main buffer=256k flush=5s;
    error_log  /var/log/nginx/pxe-error.log warn;

    # ------------------------------------------------------------ 超时与连接
    # 大 ISO 传输可能持续很久，两次写操作之间允许 5 分钟
    send_timeout 300s;
    # 装机客户端（iPXE / wget / cloud-init）会连着拉好几个文件，给足 keepalive
    keepalive_timeout 65s;
    keepalive_requests 1000;

    client_max_body_size 0;      # 本站点只提供下载，不接收上传
    limit_conn pxe_perip 10;

    # 目录列表：排查路径问题时很好用，生产环境可以关掉
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    # 平台元数据（.pxe-boot / .pxe-arch / .gitkeep）不该对外可见
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ISO 体积大、请求多，单独关掉日志可进一步降低磁盘 I/O（需要时取消注释）
    # location ~* \.(iso|img|squashfs)$ {
    #     access_log off;
    #     log_not_found off;
    # }

    # ---- 可选：把管理界面也挂到 80 端口后面（8080 是平台自带的 uvicorn）----
    #
    # !! WebSocket 必须单独放行 Upgrade。少了下面这个 /ws/ 段，
    # 侧栏的 nginx / isc-dhcp-server / tftpd-hpa 状态就不会自动更新
    # （前端只能退化为 20 秒拉一次 HTTP，慢半拍但不会卡死）。
    # location /ws/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_read_timeout 3600s;        # 长连接，别让 nginx 中途掐断
    #     proxy_send_timeout 3600s;
    # }
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header Connection "";
    #     proxy_read_timeout 600s;         # 上传大 ISO 很慢
    #     client_max_body_size 0;          # ISO 上传不能限大小
    #     # 大文件上传/下载走内核，别让 nginx 缓冲到磁盘
    #     proxy_request_buffering off;
    #     proxy_buffering off;
    #     gzip on;                         # 这里可以压：JS/CSS/JSON
    #     gzip_types text/plain text/css application/javascript application/json;
    #     gzip_min_length 1024;
    # }
    # 前端页面与 /static/ 也走反代（不配的话直接访问 8080 即可）
    # location / { proxy_pass http://127.0.0.1:8080; }
}
