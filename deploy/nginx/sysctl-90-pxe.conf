# /etc/sysctl.d/90-pxe.conf
# 高并发大带宽装机源的内核参数（万兆及以上网络按这个量级调）
# 生效：sudo sysctl --system  （或 sysctl -p /etc/sysctl.d/90-pxe.conf）

# ---------------------------------------------------------------- 连接队列
# 几十台同时建连，监听队列要够深，否则握手包被丢、表现为"有的机器连不上"
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
# 网卡收包队列：万兆满了会直接丢包
net.core.netdev_max_backlog = 250000

# ---------------------------------------------------------------- TCP 缓冲区
# 长肥管道（高带宽 × 有延迟）必须给足窗口，否则跑不满带宽。
# 下面按 10Gbps 给的，25G/40G 再往上翻倍。
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
# 自动调优要开着（默认就是 1），内核会按实际 RTT 调整窗口
net.ipv4.tcp_moderate_rcvbuf = 1
# 窗口缩放（默认开），没有它 64KB 窗口上限会卡死带宽
net.ipv4.tcp_window_scaling = 1
# 时间戳 + SACK，丢包时重传效率高很多
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1

# ---------------------------------------------------------------- 拥塞控制
# BBR 在高带宽、有一定延迟或轻微丢包的网络上吞吐明显更好。
# 前提：内核 4.9+ 且 tcp_bbr 模块可用 —— 先确认：
#   sysctl net.ipv4.tcp_available_congestion_control   # 输出里要有 bbr
#   lsmod | grep bbr        # 没有就：modprobe tcp_bbr
# 若确认不可用，把这两行注释掉，否则 sysctl 加载会报错。
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# 路径 MTU 探测：遇到 ICMP 黑洞（PMTU 不通）时能自动降 MSS，避免连接假死
net.ipv4.tcp_mtu_probing = 1

# ---------------------------------------------------------------- 连接回收
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.ip_local_port_range = 1024 65535
# TIME_WAIT 上限，几十台的量级通常碰不到，留足余量
net.ipv4.tcp_max_tw_buckets = 262144

# ---------------------------------------------------------------- 文件句柄
# nginx 每个连接一个 fd，worker_rlimit_nofile 要配得上
fs.file-max = 2097152
fs.nr_open = 2097152

# ---------------------------------------------------------------- 内存
# 关键：装机源的性能几乎全靠页缓存 —— 第一台机器把 ISO 读进内存，
# 后面几十台直接从内存发。所以绝不能让内核把缓存换出去。
vm.swappiness = 1
# 有 swap 时再低一点更保险：vm.swappiness = 0
# 脏页回写（本机基本只有写日志，保持默认即可）
vm.dirty_ratio = 40
vm.dirty_background_ratio = 10
